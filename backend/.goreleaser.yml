# .goreleaser.yaml
version: 1

before:
  hooks:
    - go mod tidy

builds:
  - id: p1nrgy
    main: .
    binary: p1nrgy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: archive
    builds:
      - p1nrgy
    format: tar.gz
    # Rename darwin to macOS using a template instead of the (removed) `replacements` field
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

# signs:
#   - artifacts: checksum
#     cmd: cosign
#     args:
#       - sign-blob
#       - --key=cosign.key
#       - --output
#       - "${artifact}.sig"
#       - "${artifact}"

dockers:
  - image_templates:
      - "ghcr.io/erwindouna/p1nrgy:{{ .Version }}"
      - "ghcr.io/erwindouna/p1nrgy:latest"
    dockerfile: Dockerfile
    goos: linux
    goarch: amd64

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: "erwindouna"
    name: "p1ngry"
  draft: false
  prerelease: auto
