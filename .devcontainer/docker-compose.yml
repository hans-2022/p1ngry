version: '3.8'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: p1ngry
      POSTGRES_USER: p1ngry
      POSTGRES_PASSWORD: p1ngry
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    image: mcr.microsoft.com/devcontainers/go:2-1.25-bookworm
    command: sleep infinity
    working_dir: /workspaces/p1ngry
    volumes:
      - ..:/workspaces:cached
    depends_on:
      - db
    environment:
      POSTGRES_HOST: db        
      POSTGRES_PORT: "5432"
      POSTGRES_DB: p1ngry
      POSTGRES_USER: p1ngry
      POSTGRES_PASSWORD: p1ngry

volumes:
  postgres-data:
