# .goreleaser.yaml
version: 1

before:
  hooks:
    - cd backend && go mod tidy

builds:
  - id: p1nrgy
    main: ./backend/p1nrgy
    binary: p1nrgy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: archive
    builds:
      - p1nrgy
    format: tar.gz
    # Rename darwin to macOS using a template instead of the (removed) `replacements` field
    name_template: >-
      {{ .Binary }}_{{ .Version }}_{{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

signs:
  - artifacts: checksum
    cmd: cosign
    args:
      - sign-blob
      - --key=cosign.key
      - --output
      - "${artifact}.sig"
      - "${artifact}"

dockers:
  - image_templates:
      - "ghcr.io/{{ .Repo }}/p1nrgy:{{ .Version }}"
      - "ghcr.io/{{ .Repo }}/p1nrgy:latest"
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64,linux/arm64"

brews:
  - name: p1nrgy
    repository:
      owner: "erwindouna"
      name: "homebrew-tap"
    commit_author:
      name: "goreleaser"
      email: "e.douna@gmail.com"
    description: "Tool for interacting with P1 electricity meter data."
    test: |
      system "#{bin}/p1nrgy --version"
    install: |
      bin.install "p1nrgy"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: "erwindouna"
    name: "p1nrgy"
  draft: false
  prerelease: auto
